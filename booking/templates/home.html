<!DOCTYPE html>
<html>
<head>
    <title>GameSlot Booking</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>

<header class="navbar">
    <div class="logo">🎮 GameSlot</div>

    <!-- <nav id="navMenu">
        <a href="#home">Home</a>
        <a href="#games">Games</a>
        <a href="#booking">Book Slot</a>
        <a href="#contact">Contact</a>
    </nav> -->

    <div class="hamburger" onclick="toggleMenu()">☰</div>
</header>

<h1 class="main-title">Welcome to GameSlot Turf Booking</h1>

<!-- Slideshow -->
<div class="slideshow-container">
    {% for game in games %}
    <div class="slide fade">
        <img src="{{ game.image.url }}" style="width:100%">
        <h2>{{ game.name }}</h2>
    </div>
    {% endfor %}
</div>

<!-- Booking Form -->
<div class="form-container">
    <h2>Book Your Slot</h2>
    <form method="POST">
        {% csrf_token %}
        <input type="text" name="player_name" placeholder="Your Name" required>

        <select name="game">
            {% for game in games %}
            <option value="{{ game.id }}">{{ game.name }}</option>
            {% endfor %}
        </select>

        <input type="date" name="date" required>
        <input type="text" name="time_slot" placeholder="Time Slot (e.g. 5-6 PM)" required>

        <button type="submit">Book Now</button>
    </form>
</div>

<footer class="footer">
    <div class="footer-content">
        

        <!-- <iframe src="YOUR_GOOGLE_FORM_LINK"
        width="100%" height="400"></iframe> -->

        <div class="contact-form">
    <h2>Contact Us</h2>

    <form method="POST">
        {% csrf_token %}

        <input type="text" name="contact_name" placeholder="Your Name" required>

        <input type="email" name="contact_email" placeholder="Your Email" required>

        <textarea name="contact_message" placeholder="Your Message" required></textarea>

        <button type="submit">Send Message</button>
    </form>
</div>


        <div class="social-icons">
            <a href="#">Instagram</a>
            <a href="#">Facebook</a>
            <a href="#">Twitter</a>
        </div>

        <p>© 2026 GameSlot. All Rights Reserved.</p>
    </div>
</footer>


<script src="/static/script.js"></script>

</body>
</html>
